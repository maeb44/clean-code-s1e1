<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta 
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>
      Todo App
    </title>
    <link 
      href="https://fonts.googleapis.com/css?family=lato:300,400,700" 
      rel="stylesheet"
      >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body>
    <header class="header">
      <img 
				class="header__img"
				src="./eisenhower-matrix.jpg" 
				alt="Eisenhower Matrix: 1. Do 2. Plan 3. Delegate 4. Eliminate"
			>
      <a 
				class="header__link" 
				href="https://goal-life.com/page/method/matrix-eisenhower"
      >
      	Want more details?
      </a>
    </header>
    <main class="main">
			<section class="add-section">
					<h2 class="add-section__title">Add Item</h2>
						<div class="add-section__input-group">
							<input 
								id="new-task"
								class="task__input"
								type="text"
								placeholder="Enter new task" 
							>
							<button class="btn add-section__btn">Add</button>
						</div>
			</section>

			<section class="todo-section">
				<h2 class="todo-section__title">Todo</h2>
				<ul 
					class="todo-section__list"
					id="incomplete-tasks"
				>
					<li class="task">
						<input 
							type="checkbox" 
							class="task__checkbox" 
							id="task-1"
						>
						<label class="task__label" for="task-1">Pay Bills</label>
						<input
							type="text"
							class="task__input edit__input"
						>
						<button class="btn task__button task__button_edit">Edit</button>
						<button class="btn task__button task__button_delete">
							<img src="./remove.svg" alt="delete task" class="task__icon">
						</button>
					</li>
					<li class="task task__button_edit">
						<input 
							type="checkbox"
							class="task__checkbox"
							id="task-2"
						>
						<label class="task__label edit__label" for="task-2">Go Shopping</label>
						<input 
							type="text" 
							value="Go Shopping" 
							class="task__input edit__input"
						>
						<button class="btn task__button task__button_edit">Save</button>
						<button class="btn task__button task__button_delete">
							<img src="./remove.svg" alt="delete task" class="task__icon">
						</button>
					</li>
				</ul>
			</section>

			<section class="completed-section">
				<h2 class="completed-section__title">Completed</h2>
				<ul 
					class="completed-section__list"
					id="completed-tasks"
					>
					<li class="task">
						<input 
							type="checkbox" 
							checked 
							class=" task__checkbox"
							id="compl-task"
						>
						<label 
							class="task__label"
							for="compl-task"
						>See the Doctor
						</label>
						<input 
							type="text" 
							class="task__input edit__input"
						>
						<button class="btn task__button task__button_edit">Edit</button>
						<button class="btn task__button task__button_delete">
							<img src="./remove.svg" alt="delete task" class="task__icon">
						</button>
					</li>
				</ul>
			</section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
