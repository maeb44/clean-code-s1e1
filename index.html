<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta 
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>
      Todo App
    </title>
    <link 
      href='https://fonts.googleapis.com/css?family=Lato:300,400,700' 
      rel='stylesheet'
      >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg">
      <a 
      class='learn-more-link' 
      href="https://goal-life.com/page/method/matrix-eisenhower"
      >
      Want more details?
      </a>
    </div>
    <div class="main-page-el">
      <p id='top-section-el'>
        <h3 class="add-sect-title">Add Item</h3>
          <div class="task-row-wrap">
            <input 
              id='new-task'
              class="task" 
            >
            <button class="btn">Add</button>
          </div>
      </p>
      <h3 class="sect-title">Todo</h3>
      <ul id='incomplete-tasks'>
        <li class="task-list">
          <input type='checkbox' class="do-btn">
          <label class="task">Pay Bills</label>
          <input
            type="text"
            class="task edit-task-input"
          >
          <button class="edit btn">
            Edit
          </button>
          <button class="delete btn">
            <img src="./remove.svg" class="delete-img">
          </button>
        </li>
        <li class="edit-mode task-list">
          <input type="checkbox" class="do-btn">
          <label class="task edit-label">Go Shopping</label>
          <input 
            type="text" 
            value="Go Shopping" 
            class="task edit-task-input"
          >
          <button class='edit btn'>Save</button>
          <button class="delete btn">
            <img src="./remove.svg" class="delete-img">
          </button>
        </li>
      </ul>
      <h3 class="sect-title">Completed</h3>
      <ul id="completed-tasks">
        <li class="task-list">
          <input type="checkbox" checked class="do-btn">
          <label class="task">See the Doctor</label>
          <input 
            type="text" 
            class="task edit-task-input"
          >
          <button class="edit btn">Edit</button>
          <button class="delete btn">
            <img src="./remove.svg" class="delete-img">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
