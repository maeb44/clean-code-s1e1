<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta 
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>
      Todo App
    </title>
    <link 
      href="https://fonts.googleapis.com/css?family=lato:300,400,700" 
      rel="stylesheet"
      >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg">
      <a 
      class="learn-more-link" 
      href="https://goal-life.com/page/method/matrix-eisenhower"
      >
      Want more details?
      </a>
    </header>
    <main class="main-page-el">
			<section class="add-sect">
					<h2 class="add-sect-title">Add Item</h2>
						<div class="task-row-wrap">
							<input 
								id="new-task"
								class="task"
								type="text"
								placeholder="Enter new task" 
							>
							<button class="btn">Add</button>
						</div>
			</section>

			<section class="todo-sect">
				<h2 class="sect-title">Todo</h2>
				<ul id="incomplete-tasks">
					<li class="task-list">
						<input type="checkbox" class="do-btn" id="task-1">
						<label 
							class="task" 
							for="task-1"
						>
							Pay Bills
						</label>
						<input
							type="text"
							class="task edit-task-input"
						>
						<button class="edit btn">
							Edit
						</button>
						<button class="delete btn">
							<img src="./remove.svg" class="delete-img">
						</button>
					</li>
					<li class="edit-mode task-list">
						<input 
							type="checkbox" 
							class="do-btn" 
							id="task-2"
						>
						<label 
							class="task edit-label"
							id="task-2"
						>
						Go Shopping
						</label>
						<input 
							type="text" 
							value="Go Shopping" 
							class="task edit-task-input"
						>
						<button class="edit btn">Save</button>
						<button class="delete btn">
							<img src="./remove.svg" class="delete-img">
						</button>
					</li>
				</ul>
			</section>

			<section class="compl-sect">
				<h2 class="sect-title">Completed</h2>
				<ul id="completed-tasks">
					<li class="task-list">
						<input 
							type="checkbox" 
							checked class="do-btn"
							id="compl-task"
						>
						<label 
							class="task"
							for="compl-task"
						>
						See the Doctor
						</label>
						<input 
							type="text" 
							class="task edit-task-input"
						>
						<button class="edit btn">Edit</button>
						<button class="delete btn">
							<img src="./remove.svg" class="delete-img">
						</button>
					</li>
				</ul>
			</section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
